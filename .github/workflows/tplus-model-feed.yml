name: T+ publish sanitized model feed
on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: write
concurrency:
  group: tplus-public-feed
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export T-only public feed
        run: python tplus_cloud/build.py
      - name: Commit only model feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tplus-feed[bot]'
          git config user.email 'tplus-feed[bot]@users.noreply.github.com'
          git add model_feed/
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git commit -m 'data(tplus): publish sanitized model feed'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 8
          done
          exit 1
